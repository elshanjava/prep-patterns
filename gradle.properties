# Корпоративная политика (AppLocker) блокирует запуск java.exe из пользовательских
# папок (C:\Users\...\.jdks, ...\.gradle\jdks) → CreateProcess error=1260.
# Поэтому:
#  - auto-download=false — Gradle не СКАЧИВАЕТ JDK в заблокированные папки;
#  - auto-detect=false   — и не СКАНИРУЕТ .jdks, значит не пробит corretto (та самая
#                          "Toolchain ... could not be probed" при запуске main/тестов).
# Тулчейн 21 берётся из ТЕКУЩЕГО JVM, на котором стартовал Gradle: в IntelliJ это
# gradleJvm=JBR 21 (Program Files, разрешён), в WSL — Temurin 21 из SDKMAN.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=false
