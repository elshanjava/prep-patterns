# Корпоративная политика (AppLocker) блокирует запуск java.exe из пользовательских
# папок (C:\Users\...\.jdks, ...\.gradle\jdks) → CreateProcess error=1260.
# Поэтому запрещаем Gradle СКАЧИВАТЬ JDK: он использует только уже установленные —
# на Windows это JBR 21 из Program Files, в WSL — Temurin 21 из SDKMAN.
org.gradle.java.installations.auto-download=false
